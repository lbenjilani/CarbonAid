<!--HTML Structure-->

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, intial-scale =1.0">
        <title>Sign Up Page</title>    
        <link rel="stylesheet" href="style.css">    <!-- Link to the external CSS file-->
        <script src = "https://accounts.google.com/gsi/client" async defer></script>    <!-- Google API -->
    </head>

    <body>
        <div class = "container">
            <div class="signup-container">
                <h1>Join the Space</h1>
                <p>Sign into yout account</p>

                <form id="signup-form" action="/singup" method="POST">
                    <input type="text" placeholder ="Name" id="name" required>
                    <input type="email" placeholder="Email" id="email" required>
                    <input type="text" placeholder="Username" id="username" required>
                    <input type="password" placeholder="Password" id="password" required>
                    <input type="password" placeholder="Confirm Password" id="confirm-password" required>

                    <button type="submit" class="signup-btn">Sign into your account</button>
                </form>

                <p>Already have an account? <a href="/login">Login here</a></p>
            </div>

            <div class="google-signin-container">
                <h2>Or Sign Up with Google</h2>
                <div id="g_id_onload"
                    data-client_id="YOUR_GOOGLE_CLIENT_ID"
                    data-login_uri="http://localhost:3000/google-login"
                    data-auto_prompt="false">
                </div>

                <div class="g_id_signin" data-type="standard"></div>
            </div>
        </div>
        <script src="script.js"></script>   <!--Link script.js file to handle form functionality-->
    </body>
</html>
