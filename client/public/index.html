<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#4caf50" />

    <!-- ✅ SEO Meta -->
    <title>CarbonAid – Track, Reduce & Offset Your Carbon Footprint</title>
    <meta
      name="description"
      content="CarbonAid helps individuals and organizations measure, track, and reduce their carbon footprint through smart analytics, AI-driven sustainability tips, and actionable goals."
    />
    <meta
      name="keywords"
      content="CarbonAid, carbon footprint, sustainability, climate action, carbon tracker, CO2 calculator, eco goals, environment, green app"
    />
    <meta name="author" content="CarbonAid Team" />

    <!-- ✅ Google Site Verification -->
    <meta
      name="google-site-verification"
      content="google665014eaf7ed4311.html"
    />

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/jpeg" href="%PUBLIC_URL%/logo_icon.jpg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo_icon.jpg" />

    <!-- ✅ Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carbonaid.onrender.com/" />
    <meta property="og:title" content="CarbonAid – Smarter Climate Action" />
    <meta
      property="og:description"
      content="Join CarbonAid to monitor your carbon footprint, receive AI-powered reduction strategies, and achieve sustainable living goals."
    />
    <meta
      property="og:image"
      content="%PUBLIC_URL%/og-preview.png"
    />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CarbonAid – Smarter Climate Action" />
    <meta
      name="twitter:description"
      content="Measure and reduce your carbon footprint with AI-driven insights and daily sustainability actions."
    />
    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/og-preview.png"
    />

    <!-- ✅ Manifest (PWA) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts (Optional, modern look) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
